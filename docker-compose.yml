services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thirukkural
      POSTGRES_USER: thirukkural
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thirukkural -d thirukkural"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env        # OPENAI_API_KEY etc. Never baked into the image.
    environment:
      DATABASE_URL: postgresql://thirukkural:${POSTGRES_PASSWORD}@db:5432/thirukkural
      TRUST_PROXY: "true"   # backend is only reachable through nginx, which sets X-Real-IP
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Local-only port for a reverse proxy already on this server (reviewlens etc.) to forward to.
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      - backend

  # OPTIONAL standalone HTTPS: only start with `docker compose --profile caddy up -d`.
  # Do NOT use it if another proxy already owns ports 80/443 on the server.
  # HTTPS termination: automatic Let's Encrypt certificates for ${DOMAIN}
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates; keep this volume
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
